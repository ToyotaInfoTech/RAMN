name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12",]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -r scripts/tests/requirements.txt

      - name: Build mock testing libraries
        run: |
          chmod +x scripts/tests/build_testing_libs.sh
          ./scripts/tests/build_testing_libs.sh

      - name: Run test suite
        run: |
          PYTHONPATH=scripts/tests python -m pytest -v scripts/tests/
